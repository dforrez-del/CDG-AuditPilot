name: Windows build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore CDG.AuditPilot.sln
      - name: Build
        run: dotnet build CDG.AuditPilot.sln -c Release --no-restore
      - name: Publish Windows x64
        run: dotnet publish src/CDG.AuditPilot.Desktop/CDG.AuditPilot.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: AuditPilot-Windows-x64-preview
          path: publish/
